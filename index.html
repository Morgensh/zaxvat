<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Walk & Shoot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    body { cursor: none; touch-action: none; }
    canvas { display: block; }
    #status {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      color: #888; font-family: monospace; font-size: 13px; pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: #444; font-family: monospace; font-size: 12px; pointer-events: none;
    }
    #gameover {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      align-items: center; justify-content: center; flex-direction: column;
      color: #ff3333; font-family: monospace; font-size: 42px; font-weight: bold;
      text-shadow: 0 0 20px #ff0000;
    }
    #gameover span { font-size: 17px; color: #aaa; margin-top: 16px; cursor: pointer; }
    #gameover.show { display: flex; }

    /* Touch joystick */
    #joystick-zone {
      position: fixed; left: 0; bottom: 0;
      width: 45%; height: 45%;
      z-index: 10; pointer-events: none;
    }
    #joystick-base {
      position: absolute; display: none;
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.15);
      transform: translate(-50%, -50%);
    }
    #joystick-thumb {
      position: absolute; left: 50%; top: 50%;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: translate(-50%, -50%);
    }
    #shoot-btn {
      position: fixed; right: 32px; bottom: 80px;
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(255,80,80,0.25);
      border: 2px solid rgba(255,80,80,0.45);
      display: none; align-items: center; justify-content: center;
      font-size: 28px; z-index: 10; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #shoot-btn.active { background: rgba(255,80,80,0.5); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status">Загружаю...</div>
  <div id="hint">WASD — движение &nbsp;|&nbsp; ЛКМ — стрельба</div>
  <div id="gameover">
    ВЫ МЕРТВЫ
    <span onclick="location.reload()">[ нажмите чтобы начать заново ]</span>
  </div>

  <!-- Touch controls -->
  <div id="joystick-zone">
    <div id="joystick-base"><div id="joystick-thumb"></div></div>
  </div>
  <div id="shoot-btn">🔫</div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // CANVAS + CONTEXT
    // ═══════════════════════════════════════════════════════════
    const canvas    = document.getElementById('c');
    const ctx       = canvas.getContext('2d', { alpha: false }); // alpha:false = быстрее
    const statusEl  = document.getElementById('status');
    const gameoverEl = document.getElementById('gameover');

    let CW = canvas.width  = window.innerWidth;
    let CH = canvas.height = window.innerHeight;
    let HW = CW / 2, HH = CH / 2; // half-width / half-height — кэшируем

    window.addEventListener('resize', () => {
      CW = canvas.width  = window.innerWidth;
      CH = canvas.height = window.innerHeight;
      HW = CW / 2; HH = CH / 2;
      rebuildPatterns();
    });

    // ═══════════════════════════════════════════════════════════
    // АДАПТИВНОЕ КАЧЕСТВО
    // Если FPS падает — автоматически снижаем детали
    // ═══════════════════════════════════════════════════════════
    let fpsSmooth  = 60;
    let lowQuality = false; // включается если FPS < 40

    // ═══════════════════════════════════════════════════════════
    // ЗАГРУЗКА РЕСУРСОВ
    // ═══════════════════════════════════════════════════════════
    const WALK_COUNT  = 8;
    const walkFrames  = [];
    const walkCrops   = [];
    const enemyFrames = [];
    const enemyCrops  = [];
    let weaponImg, bulletImg, crosshairImg, muzzleImg;
    let groundImg, ground2Img, ground3Img;
    let groundPat, ground2Pat, ground3Pat;
    const rockImgs   = [null, null, null];
    const rockBounds = [null, null, null];
    let weaponBounds = null;

    function rebuildPatterns() {
      if (groundImg)  groundPat  = ctx.createPattern(groundImg,  'repeat');
      if (ground2Img) ground2Pat = ctx.createPattern(ground2Img, 'repeat');
      if (ground3Img) ground3Pat = ctx.createPattern(ground3Img, 'repeat');
    }

    // detectBounds — масштабируем картинку до 256px макс перед анализом
    // это в 4–16x быстрее чем на оригинальном размере
    function detectBounds(img) {
      const MAX = 256;
      const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth  * scale);
      const h = Math.round(img.naturalHeight * scale);
      const oc = document.createElement('canvas');
      oc.width = w; oc.height = h;
      const ox = oc.getContext('2d');
      ox.drawImage(img, 0, 0, w, h);
      const d = ox.getImageData(0, 0, w, h).data;
      let x0 = w, x1 = 0, y0 = h, y1 = 0;
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++)
          if (d[(y * w + x) * 4 + 3] > 30) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
      const p = 2;
      // Возвращаем bounds в координатах оригинала
      return {
        x: Math.max(0, (x0 - p) / scale),
        y: Math.max(0, (y0 - p) / scale),
        w: (x1 - x0 + p * 2) / scale,
        h: (y1 - y0 + p * 2) / scale,
      };
    }

    let loaded = 0;
    const TOTAL = WALK_COUNT + WALK_COUNT + 4 + 3 + 3;

    function onLoad() {
      loaded++;
      statusEl.textContent = `Загружаю ${loaded}/${TOTAL}...`;
      if (loaded === TOTAL) { statusEl.textContent = ''; startGame(); }
    }

    // Загружаем detectBounds через setTimeout чтобы не блокировать поток
    function loadSprite(src, frames, crops, idx) {
      const img = new Image();
      img.src = src;
      img.onload = () => {
        setTimeout(() => { crops[idx] = detectBounds(img); onLoad(); }, 0);
      };
      img.onerror = () => { crops[idx] = { x:0, y:0, w:64, h:64 }; onLoad(); };
      frames.push(img);
    }

    for (let i = 0; i < WALK_COUNT; i++) loadSprite(`walked/walk_${i}.png`,  walkFrames,  walkCrops,  i);
    for (let i = 0; i < WALK_COUNT; i++) loadSprite(`enemy1/walk_${i}.png`,  enemyFrames, enemyCrops, i);

    function loadImg(src, cb) {
      const img = new Image();
      img.src = src;
      img.onload  = () => { cb(img); onLoad(); };
      img.onerror = () => { cb(null); onLoad(); };
    }

    loadImg('weapon/weaponR1.png',  img => { weaponImg    = img; if(img) weaponBounds = detectBounds(img); });
    loadImg('weapon/bullet.png',    img => { bulletImg    = img; });
    loadImg('weapon/crosshair.png', img => { crosshairImg = img; });
    loadImg('weapon/muzzle.png',    img => { muzzleImg    = img; });

    loadImg('phon/ground_white.png',  img => { groundImg  = img; if(img) groundPat  = ctx.createPattern(img,'repeat'); });
    loadImg('phon/ground2_white.png', img => { ground2Img = img; if(img) ground2Pat = ctx.createPattern(img,'repeat'); });
    loadImg('phon/ground3_white.png', img => { ground3Img = img; if(img) ground3Pat = ctx.createPattern(img,'repeat'); });

    for (let i = 0; i < 3; i++) {
      const idx = i;
      loadImg(`phon/rock${i+1}.png`, img => {
        rockImgs[idx]   = img;
        rockBounds[idx] = img ? detectBounds(img) : null;
      });
    }

    // ═══════════════════════════════════════════════════════════
    // ВВОД — клавиатура
    // ═══════════════════════════════════════════════════════════
    const keys  = {};
    const mouse = { x: HW, y: HH };

    window.addEventListener('keydown',   e => { keys[e.key] = true; });
    window.addEventListener('keyup',     e => { keys[e.key] = false; });
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', e => { if (e.button === 0 && !gameOver) shoot(); });

    // ═══════════════════════════════════════════════════════════
    // ТАЧ-УПРАВЛЕНИЕ — джойстик + кнопка стрельбы
    // ═══════════════════════════════════════════════════════════
    const isMobile = 'ontouchstart' in window;
    const joyZone  = document.getElementById('joystick-zone');
    const joyBase  = document.getElementById('joystick-base');
    const joyThumb = document.getElementById('joystick-thumb');
    const shootBtn = document.getElementById('shoot-btn');

    const joy = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
    const JOY_RADIUS = 45;
    const JOY_DEAD   = 8;

    if (isMobile) {
      joyBase.style.display  = 'block';
      shootBtn.style.display = 'flex';
      document.getElementById('hint').style.display = 'none';

      // Джойстик — левая половина экрана
      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (t.clientX > CW * 0.5) continue; // правая половина — стрельба
          if (joy.active) continue;
          joy.active = true; joy.id = t.identifier;
          joy.bx = t.clientX; joy.by = t.clientY;
          joy.dx = 0; joy.dy = 0;
          joyBase.style.left = joy.bx + 'px';
          joyBase.style.top  = joy.by + 'px';
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (t.identifier !== joy.id) continue;
          const dx = t.clientX - joy.bx;
          const dy = t.clientY - joy.by;
          const d  = Math.sqrt(dx*dx + dy*dy);
          const clamped = Math.min(d, JOY_RADIUS);
          joy.dx = d > JOY_DEAD ? (dx / d) * (clamped / JOY_RADIUS) : 0;
          joy.dy = d > JOY_DEAD ? (dy / d) * (clamped / JOY_RADIUS) : 0;
          joyThumb.style.transform =
            `translate(calc(-50% + ${joy.dx * JOY_RADIUS}px), calc(-50% + ${joy.dy * JOY_RADIUS}px))`;
          // Прицел — направляем в сторону движения джойстика (если нет другого тача)
          mouse.x = HW + joy.dx * 200;
          mouse.y = HH + joy.dy * 200;
        }
      }, { passive: false });

      const endJoy = e => {
        for (const t of e.changedTouches) {
          if (t.identifier !== joy.id) continue;
          joy.active = false; joy.id = null;
          joy.dx = 0; joy.dy = 0;
          joyThumb.style.transform = 'translate(-50%, -50%)';
        }
      };
      canvas.addEventListener('touchend',    endJoy, { passive: false });
      canvas.addEventListener('touchcancel', endJoy, { passive: false });

      // Стрельба — тап по правой половине или кнопка
      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (t.clientX <= CW * 0.5) continue;
          if (!gameOver) shoot();
        }
      }, { passive: false });

      shootBtn.addEventListener('touchstart', e => {
        e.preventDefault();
        shootBtn.classList.add('active');
        if (!gameOver) shoot();
      }, { passive: false });
      shootBtn.addEventListener('touchend', () => shootBtn.classList.remove('active'));
    }

    // ═══════════════════════════════════════════════════════════
    // КОНСТАНТЫ
    // ═══════════════════════════════════════════════════════════
    const SPRITE_H       = 85;
    const ENEMY_H        = 75;
    const WEAPON_W       = 62;
    const WEAPON_H       = 31;
    const TIP_DX         = WEAPON_W * 1.30;
    const TIP_DY         = -WEAPON_H * 0.10;
    const HAND_OFFSET_X  = 10;
    const HAND_OFFSET_Y  = SPRITE_H * 0.22;

    const ENEMY_SPEED        = 1.8;
    const ENEMY_HP           = 3;
    const ENEMY_HIT_RADIUS2  = 30 * 30;  // используем квадрат — без sqrt!
    const BULLET_HIT_RADIUS2 = 28 * 28;
    const ENEMY_DAMAGE       = 18;
    const DAMAGE_COOLDOWN    = 800;
    const SPAWN_INTERVAL     = 3000;
    const SPAWN_RADIUS       = 650;
    const PLAYER_MAX_HP      = 100;
    const MAX_ENEMIES        = 15;       // лимит зомби на экране
    const MAX_BULLETS        = 20;       // лимит пуль

    // ═══════════════════════════════════════════════════════════
    // КАРТА — камни
    // ═══════════════════════════════════════════════════════════
    const CHUNK_SIZE = 600;
    const rocksCache = new Map();

    function seededRand(seed) {
      let s = seed | 0;
      return () => { s = Math.imul(s, 1664525) + 1013904223 | 0; return (s >>> 0) / 0xffffffff; };
    }

    function getChunkRocks(cx, cy) {
      const key = cx * 10000 + cy; // числовой ключ быстрее строкового
      if (rocksCache.has(key)) return rocksCache.get(key);
      const rand  = seededRand((cx * 73856093) ^ (cy * 19349663));
      const count = Math.floor(rand() * 3);
      const rocks = [];
      for (let i = 0; i < count; i++)
        rocks.push({
          wx: cx * CHUNK_SIZE + rand() * CHUNK_SIZE,
          wy: cy * CHUNK_SIZE + rand() * CHUNK_SIZE,
          type:  Math.floor(rand() * 3),
          scale: 0.035 + rand() * 0.045,
        });
      rocksCache.set(key, rocks);
      return rocks;
    }

    // ═══════════════════════════════════════════════════════════
    // СОСТОЯНИЕ
    // ═══════════════════════════════════════════════════════════
    const bullets       = [];
    const muzzleFlashes = [];
    const enemies       = [];
    // Переиспользуемый массив для depth sort — не аллоцируем каждый кадр
    const drawables     = [];

    let gameOver   = false;
    let spawnTimer = 0;
    let killCount  = 0;

    // Кэшируем gradient healthbar — пересоздаём только при изменении HP
    let hpGradient   = null;
    let hpGradientRatio = -1;

    // Offscreen canvas для hit-flash — рисуем спрайт туда,
    // заливаем белым через source-atop (только по непрозрачным пикселям)
    const flashCvs = document.createElement('canvas');
    flashCvs.width = 256; flashCvs.height = 256;
    const fCtx = flashCvs.getContext('2d');

    const player = {
      wx: 0, wy: 0,
      frame: 0, frameTimer: 0, frameDelay: 85,
      speed: 7,
      facingLeft: false,
      moving: false,
      hp: PLAYER_MAX_HP,
      damageCooldown: 0,
      hitFlash: 0,
    };

    // Инлайним toScreen — не создаём объект каждый раз
    function toScreenX(wx) { return wx - player.wx + HW; }
    function toScreenY(wy) { return wy - player.wy + HH; }

    function getAngleToMouse() {
      return Math.atan2(mouse.y - HH, mouse.x - HW);
    }
    function getHandPos() {
      const flip = player.facingLeft ? -1 : 1;
      return { x: HW + HAND_OFFSET_X * flip, y: HH + HAND_OFFSET_Y };
    }
    function getBarrelTip() {
      const h = getHandPos();
      const a = getAngleToMouse();
      const ca = Math.cos(a), sa = Math.sin(a);
      const sx = h.x + ca * TIP_DX - sa * TIP_DY;
      const sy = h.y + sa * TIP_DX + ca * TIP_DY;
      return { sx, sy, wx: player.wx + (sx - HW), wy: player.wy + (sy - HH) };
    }
    function shoot() {
      if (bullets.length >= MAX_BULLETS) return;
      const tip = getBarrelTip();
      const a   = getAngleToMouse();
      bullets.push({ wx: tip.wx, wy: tip.wy, vx: Math.cos(a)*14, vy: Math.sin(a)*14, angle: a, life: 1 });
      muzzleFlashes.push({ x: tip.sx, y: tip.sy, angle: a, life: 1 });
    }

    function spawnEnemy() {
      if (enemies.length >= MAX_ENEMIES) return;
      const angle = Math.random() * Math.PI * 2;
      const dist  = SPAWN_RADIUS + Math.random() * 200;
      enemies.push({
        wx: player.wx + Math.cos(angle) * dist,
        wy: player.wy + Math.sin(angle) * dist,
        frame: 0, frameTimer: 0, frameDelay: 110,
        hp: ENEMY_HP, hitFlash: 0, dead: false, dying: 0,
      });
    }

    // ═══════════════════════════════════════════════════════════
    // ИГРОВОЙ ЦИКЛ
    // ═══════════════════════════════════════════════════════════
    let lastTime = 0;
    const TARGET_FPS = 60;
    const FRAME_MIN  = 1000 / TARGET_FPS;

    function startGame() {
      spawnEnemy(); spawnEnemy(); spawnEnemy();
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function loop(ts) {
      if (gameOver) return;

      const dt = Math.min(ts - lastTime, 50);
      lastTime = ts;

      // Считаем FPS для адаптивного качества
      fpsSmooth = fpsSmooth * 0.95 + (1000 / Math.max(dt, 1)) * 0.05;
      lowQuality = fpsSmooth < 30;

      // ── Спавн ──
      spawnTimer += dt;
      if (spawnTimer >= SPAWN_INTERVAL) {
        spawnTimer = 0;
        spawnEnemy();
        if (killCount > 5)  spawnEnemy();
        if (killCount > 15) spawnEnemy();
      }

      // ── Движение игрока ──
      const left  = keys['ArrowLeft']  || keys['a'] || keys['A'] || (isMobile && joy.dx < -0.2);
      const right = keys['ArrowRight'] || keys['d'] || keys['D'] || (isMobile && joy.dx >  0.2);
      const up    = keys['ArrowUp']    || keys['w'] || keys['W'] || (isMobile && joy.dy < -0.2);
      const down  = keys['ArrowDown']  || keys['s'] || keys['S'] || (isMobile && joy.dy >  0.2);

      player.moving = left || right || up || down;

      if (isMobile && joy.active) {
        // Плавное движение по джойстику
        player.wx += joy.dx * player.speed;
        player.wy += joy.dy * player.speed;
      } else {
        if (left)  player.wx -= player.speed;
        if (right) player.wx += player.speed;
        if (up)    player.wy -= player.speed;
        if (down)  player.wy += player.speed;
      }

      player.facingLeft = mouse.x < HW;
      if (player.damageCooldown > 0) player.damageCooldown -= dt;
      if (player.hitFlash > 0)       player.hitFlash -= dt;

      if (player.moving) {
        player.frameTimer += dt;
        if (player.frameTimer >= player.frameDelay) {
          player.frameTimer = 0;
          player.frame = (player.frame + 1) % WALK_COUNT;
        }
      } else { player.frame = 0; }

      // ── Пули ──
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.wx += b.vx; b.wy += b.vy;
        b.life -= dt / 2000;
        const sx = toScreenX(b.wx), sy = toScreenY(b.wy);
        if (b.life <= 0 || sx < -200 || sx > CW+200 || sy < -200 || sy > CH+200) {
          bullets.splice(i, 1); continue;
        }
        // Коллизия — без sqrt, используем квадрат расстояния
        let hit = false;
        for (const e of enemies) {
          if (e.dead) continue;
          const dx = b.wx - e.wx, dy = b.wy - e.wy;
          if (dx*dx + dy*dy < BULLET_HIT_RADIUS2) {
            e.hp--; e.hitFlash = 100;
            if (e.hp <= 0) { e.dead = true; e.dying = 400; killCount++; }
            hit = true; break;
          }
        }
        if (hit) { bullets.splice(i, 1); }
      }

      // ── Вспышки ──
      for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        muzzleFlashes[i].life -= dt / 80;
        if (muzzleFlashes[i].life <= 0) muzzleFlashes.splice(i, 1);
      }

      // ── Зомби AI ──
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.dead) {
          e.dying -= dt;
          if (e.dying <= 0) { enemies.splice(i, 1); }
          continue;
        }
        if (e.hitFlash > 0) e.hitFlash -= dt;

        const dx = player.wx - e.wx;
        const dy = player.wy - e.wy;
        const dist2 = dx*dx + dy*dy;

        if (dist2 > ENEMY_HIT_RADIUS2) {
          const dist = Math.sqrt(dist2);
          e.wx += (dx / dist) * ENEMY_SPEED;
          e.wy += (dy / dist) * ENEMY_SPEED;
          e.frameTimer += dt;
          if (e.frameTimer >= e.frameDelay) {
            e.frameTimer = 0;
            e.frame = (e.frame + 1) % WALK_COUNT;
          }
        } else {
          if (player.damageCooldown <= 0) {
            player.hp = Math.max(0, player.hp - ENEMY_DAMAGE);
            player.damageCooldown = DAMAGE_COOLDOWN;
            player.hitFlash = 350;
            hpGradientRatio = -1; // сброс кэша градиента
            if (player.hp <= 0) {
              gameOver = true;
              gameoverEl.classList.add('show');
            }
          }
        }
      }

      draw();
      requestAnimationFrame(loop);
    }

    // ═══════════════════════════════════════════════════════════
    // РИСОВАНИЕ
    // ═══════════════════════════════════════════════════════════

    // Вспышка — без compositeOperation 'screen' (дорого), рисуем с globalAlpha
    function drawMuzzle(img, cx, cy, w, h, angle, alpha) {
      if (!img || alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.translate(cx, cy);
      if (angle) ctx.rotate(angle);
      ctx.drawImage(img, -w/2, -h/2, w, h);
      ctx.restore();
    }

    function drawHealthBar() {
      const barW  = 200;
      const barH  = 14;
      const barX  = HW - barW / 2;
      const barY  = 16;
      const ratio = player.hp / PLAYER_MAX_HP;

      // Фон
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#000';
      ctx.fillRect(barX - 3, barY - 3, barW + 6, barH + 6);
      ctx.globalAlpha = 1;

      // Трек
      ctx.fillStyle = '#222';
      ctx.fillRect(barX, barY, barW, barH);

      // Цветная полоска — кэшируем градиент
      if (ratio !== hpGradientRatio) {
        hpGradientRatio = ratio;
        const r = Math.round(255 * (1 - ratio));
        const g = Math.round(210 * ratio);
        hpGradient = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        hpGradient.addColorStop(0, `rgb(${r},${g},30)`);
        hpGradient.addColorStop(1, `rgb(${Math.min(255,r+40)},${Math.min(255,g+40)},50)`);
      }
      ctx.fillStyle = hpGradient;
      ctx.fillRect(barX, barY, barW * ratio, barH);

      // Рамка
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);

      // Текст
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${player.hp} / ${PLAYER_MAX_HP}`, barX + barW / 2, barY + barH / 2);

      // Счёт
      ctx.fillStyle = '#bbb';
      ctx.font = '11px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`💀 ${killCount}`, barX + barW + 10, barY + barH / 2);
    }

    function draw() {
      // ── Фон ──
      ctx.fillStyle = '#6b6b8a';
      ctx.fillRect(0, 0, CW, CH);

      // Красная виньетка при уроне — только fillRect, без save/restore
      if (player.hitFlash > 0) {
        ctx.globalAlpha = (player.hitFlash / 350) * 0.38;
        ctx.fillStyle   = '#ff0000';
        ctx.fillRect(0, 0, CW, CH);
        ctx.globalAlpha = 1;
      }

      // ── Паттерны фона ──
      const tw = groundImg  ? groundImg.width   : 512;
      const th = groundImg  ? groundImg.height  : 512;
      const offX = ((-player.wx % tw) + tw) % tw;
      const offY = ((-player.wy % th) + th) % th;

      ctx.globalCompositeOperation = 'multiply';
      if (groundPat) {
        ctx.save();
        ctx.globalAlpha = 0.90;
        ctx.translate(offX, offY);
        ctx.fillStyle = groundPat;
        ctx.fillRect(-offX, -offY, CW + tw, CH + th);
        ctx.restore();
      }
      if (!lowQuality && ground2Pat) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.translate(offX, offY);
        ctx.fillStyle = ground2Pat;
        ctx.fillRect(-offX, -offY, CW + tw, CH + th);
        ctx.restore();
      }
      if (!lowQuality && ground3Pat) {
        ctx.save();
        ctx.globalAlpha = 0.04;
        ctx.translate(offX, offY);
        ctx.fillStyle = ground3Pat;
        ctx.fillRect(-offX, -offY, CW + tw, CH + th);
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;

      // ── Камни ──
      if (!lowQuality) {
        const margin = 200;
        const vpL = player.wx - HW - margin, vpR = player.wx + HW + margin;
        const vpT = player.wy - HH - margin, vpB = player.wy + HH + margin;
        const cxMin = Math.floor(vpL / CHUNK_SIZE), cxMax = Math.floor(vpR / CHUNK_SIZE);
        const cyMin = Math.floor(vpT / CHUNK_SIZE), cyMax = Math.floor(vpB / CHUNK_SIZE);

        const visRocks = [];
        for (let cx = cxMin; cx <= cxMax; cx++)
          for (let cy = cyMin; cy <= cyMax; cy++)
            for (const r of getChunkRocks(cx, cy))
              if (r.wx >= vpL && r.wx <= vpR && r.wy >= vpT && r.wy <= vpB)
                visRocks.push(r);

        ctx.globalAlpha = 0.55;
        ctx.globalCompositeOperation = 'multiply';
        for (const r of visRocks) {
          const img = rockImgs[r.type], bnd = rockBounds[r.type];
          if (!img || !bnd) continue;
          const sx = toScreenX(r.wx), sy = toScreenY(r.wy);
          const rw = bnd.w * r.scale, rh = bnd.h * r.scale;
          ctx.drawImage(img, bnd.x, bnd.y, bnd.w, bnd.h, sx - rw/2, sy - rh/2, rw, rh);
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      // ── Depth sort — переиспользуем массив ──
      drawables.length = 0;
      drawables.push({ wy: player.wy, type: 0 }); // 0 = player
      for (const e of enemies) drawables.push({ wy: e.wy, type: 1, e });
      drawables.sort((a, b) => a.wy - b.wy);

      for (const d of drawables) {
        if (d.type === 0) {
          // ── Персонаж ──
          const crop    = walkCrops[player.frame] || {x:0,y:0,w:64,h:64};
          const spriteW = Math.round(SPRITE_H * (crop.w / crop.h));
          if (player.facingLeft) {
            ctx.save();
            ctx.translate(HW, 0); ctx.scale(-1, 1);
            ctx.drawImage(walkFrames[player.frame], crop.x, crop.y, crop.w, crop.h,
              -spriteW/2, HH - SPRITE_H/2, spriteW, SPRITE_H);
            ctx.restore();
          } else {
            ctx.drawImage(walkFrames[player.frame], crop.x, crop.y, crop.w, crop.h,
              HW - spriteW/2, HH - SPRITE_H/2, spriteW, SPRITE_H);
          }

          // ── Оружие ──
          if (weaponImg && weaponBounds) {
            const h = getHandPos(), angle = getAngleToMouse();
            const flipY = Math.abs(angle) > Math.PI / 2;
            ctx.save();
            ctx.translate(h.x, h.y); ctx.rotate(angle);
            if (flipY) ctx.scale(1, -1);
            ctx.drawImage(weaponImg, weaponBounds.x, weaponBounds.y, weaponBounds.w, weaponBounds.h,
              -WEAPON_W * 0.30, -WEAPON_H / 2, WEAPON_W, WEAPON_H);
            ctx.restore();
          }

        } else {
          // ── Зомби ──
          const e   = d.e;
          const sx  = toScreenX(e.wx);
          const sy  = toScreenY(e.wy);
          const img = enemyFrames[e.frame];
          const crop = enemyCrops[e.frame] || {x:0,y:0,w:64,h:64};
          if (!img) continue;
          const spriteW   = Math.round(ENEMY_H * (crop.w / crop.h));
          const facingLeft = (player.wx - e.wx) < 0;

          const useFlash = !e.dead && e.hitFlash > 0;
          if (e.dead) ctx.globalAlpha = Math.max(0, e.dying / 400);

          if (useFlash) {
            // Рисуем спрайт на offscreen canvas, заливаем белым через source-atop
            // — белый цвет накладывается ТОЛЬКО на непрозрачные пиксели спрайта
            fCtx.clearRect(0, 0, spriteW, ENEMY_H);
            if (facingLeft) {
              fCtx.save();
              fCtx.translate(spriteW, 0); fCtx.scale(-1, 1);
              fCtx.drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, spriteW, ENEMY_H);
              fCtx.restore();
            } else {
              fCtx.drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, spriteW, ENEMY_H);
            }
            fCtx.globalCompositeOperation = 'source-atop';
            fCtx.globalAlpha = (e.hitFlash / 100) * 0.85;
            fCtx.fillStyle = '#ffffff';
            fCtx.fillRect(0, 0, spriteW, ENEMY_H);
            fCtx.globalCompositeOperation = 'source-over';
            fCtx.globalAlpha = 1;
            ctx.drawImage(flashCvs, 0, 0, spriteW, ENEMY_H,
              sx - spriteW/2, sy - ENEMY_H/2, spriteW, ENEMY_H);
          } else {
            if (facingLeft) {
              ctx.save();
              ctx.translate(sx, 0); ctx.scale(-1, 1);
              ctx.drawImage(img, crop.x, crop.y, crop.w, crop.h,
                -spriteW/2, sy - ENEMY_H/2, spriteW, ENEMY_H);
              ctx.restore();
            } else {
              ctx.drawImage(img, crop.x, crop.y, crop.w, crop.h,
                sx - spriteW/2, sy - ENEMY_H/2, spriteW, ENEMY_H);
            }
          }
          ctx.globalAlpha = 1;
        }
      }

      // ── Вспышки — без screen blending ──
      for (const f of muzzleFlashes)
        drawMuzzle(muzzleImg, f.x, f.y, 80, 80, f.angle, f.life);

      // ── Пули ──
      if (bulletImg) {
        for (const b of bullets) {
          const sx = toScreenX(b.wx), sy = toScreenY(b.wy);
          ctx.save();
          ctx.globalAlpha = Math.min(1, b.life * 2);
          ctx.translate(sx, sy); ctx.rotate(b.angle);
          ctx.drawImage(bulletImg, -26, -26, 52, 52);
          ctx.restore();
        }
      }

      // ── Прицел (только десктоп) ──
      if (!isMobile && crosshairImg) {
        ctx.globalAlpha = 0.85;
        ctx.drawImage(crosshairImg, mouse.x - 20, mouse.y - 20, 40, 40);
        ctx.globalAlpha = 1;
      }

      // ── HUD ──
      drawHealthBar();
    }

    if (loaded === TOTAL) startGame();
  </script>
</body>
